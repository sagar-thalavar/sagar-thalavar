name: Daily Streak

on:
  schedule:
    - cron: '0 3 * * *'   # base trigger at 03:00 UTC; actual commits land at random times via sleep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Random delay (spreads commits across the day, skipped on manual trigger)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 57600))   # up to 16 hours of random offset

      - name: Make 1–5 random commits
        env:
          MAX_GAP: ${{ github.event_name == 'workflow_dispatch' && '10' || '300' }}
        run: |
          git config user.name "sagar-thalavar"
          git config user.email "164482798+sagar-thalavar@users.noreply.github.com"

          count=$((RANDOM % 5 + 1))
          echo "Making $count commit(s) today"

          for i in $(seq 1 $count); do
            sleep $((RANDOM % MAX_GAP + 1))
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> STREAK.md
            git add STREAK.md
            git commit -m "chore: daily log $(date -u '+%Y-%m-%d %H:%M')"
          done

      - name: Update static stats SVGs
        run: |
          git config user.name "sagar-thalavar"
          git config user.email "164482798+sagar-thalavar@users.noreply.github.com"

          # Download the fresh SVGs
          curl -s -o github-stats.svg "https://github-stats-extended.vercel.app/api?username=sagar-thalavar&show_icons=true&theme=tokyonight&count_private=true&hide_border=true&include_all_commits=true&hide=issues,contribs"
          curl -s -o streak-stats.svg "https://streak-stats.demolab.com?user=sagar-thalavar&theme=tokyonight&hide_border=true"

          # Add and commit the updated SVGs if they changed
          git add github-stats.svg streak-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update static stats SVGs for $(date -u '+%Y-%m-%d')"
          fi

          git push
